services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sports_hub
      POSTGRES_USER: sports_hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - sports_hub_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sports_hub -d sports_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://sports_hub:${POSTGRES_PASSWORD:-changeme}@db:5432/sports_hub
      SECRET_KEY: ${SECRET_KEY:-replace-with-a-long-random-string}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace-with-another-long-random-string}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-*}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sportshub.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-admin-password}
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  sports_hub_pg:
